name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Testes offline (JVM)
        run: ./gradlew test
      - name: Compila o código compartilhado para Wasm
        run: ./gradlew :contract:compileKotlinWasmJs :core:compileKotlinWasmJs
