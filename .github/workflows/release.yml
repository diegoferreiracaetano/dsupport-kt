name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Install libraries for the headless Compose render test
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1 libgl1
      - name: Test
        run: ./gradlew test
      - name: Build the distributions
        run: ./gradlew installDist
      - name: Package
        run: |
          mkdir -p dist
          for module in cli server mcp-orders mcp-tickets; do
            (cd $module/build/install && zip -qr ../../../dist/dsupport-$module-${GITHUB_REF_NAME}.zip .)
          done
          zip -qr dist/dsupport-config-${GITHUB_REF_NAME}.zip config data
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.zip
