<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
body{width:1000px;height:420px;overflow:hidden;background:#0a0e1c;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff;position:relative}
.glow{position:absolute;inset:0;background:radial-gradient(520px 340px at 78% 55%,rgba(86,98,255,.38),transparent 70%),radial-gradient(420px 260px at 12% 0%,rgba(168,85,247,.22),transparent 70%)}
.robot{position:absolute;right:30px;bottom:-8px;height:410px;-webkit-mask-image:radial-gradient(ellipse 52% 56% at 50% 52%,#000 55%,transparent 100%);mask-image:radial-gradient(ellipse 52% 56% at 50% 52%,#000 55%,transparent 100%)}
.left{position:absolute;left:56px;top:0;bottom:0;width:590px;display:flex;flex-direction:column;justify-content:center}
h1{font-size:72px;line-height:1;letter-spacing:-.04em;font-weight:800}
.grad{display:block;margin-top:10px;font-size:48px;letter-spacing:-.03em;font-weight:800;background:linear-gradient(90deg,#7f6bff,#2dd4ff 55%,#ff6bd6);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin-top:18px;font-size:23px;line-height:1.35;color:#b8c0dc}
.chips{display:flex;gap:10px;margin-top:24px}
.chip{border:1.5px solid rgba(255,255,255,.22);background:rgba(255,255,255,.07);border-radius:14px;padding:8px 14px;font-size:17px;font-weight:600;color:#e8ecff}
.chip b{color:#7ce3ff}
</style></head><body>
<div class="glow"></div>
<img class="robot" src="robot.png">
<div class="left">
<h1>AI in Practice</h1>
<span class="grad">RAG · MCP · Multi-Agent</span>
<p class="sub">Built from scratch in Kotlin.<br>No magic frameworks.</p>
<div class="chips"><span class="chip"><b>$0.0025</b> per run</span><span class="chip"><b>380+</b> offline tests</span><span class="chip">facts <b>93% → 100%</b></span></div>
</div>
</body></html>
